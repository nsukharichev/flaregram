# Deployment-specific configuration; the library's original wrangler.toml is unchanged.
# Run: npx wrangler deploy --config wrangler.deploy.toml
name = "flaregram"
main = "src/deploy.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
DROP_PENDING_UPDATES = "False"

# A strict per-request budget keeps this compatible with Workers Free.
[limits]
cpu_ms = 10
subrequests = 5
