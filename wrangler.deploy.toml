# Deployment-specific config; original wrangler.toml stays unchanged.
# Run: npx wrangler deploy --config wrangler.deploy.toml
name = "flaregram"
main = "src/deploy.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
DROP_PENDING_UPDATES = "False"

# No paid bindings (KV, R2, D1, Durable Objects, etc.).
# Workers Free automatically enforces 100,000 requests/day (account-wide)
# and 10 ms CPU/request; explicit CPU limits require a paid plan.
